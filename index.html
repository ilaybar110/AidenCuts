<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aiden Cuts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2ECDF;
    --ink-dim:#B9AF98;
    --bg:#120F0B;
    --bg-2:#1B1712;
    --copper:#C1652F;
    --copper-bright:#E98A44;
    --redstripe:#D2483E;
    --line:rgba(242,236,223,0.14);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
  }
  body{
    color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--copper); color:#150f09; }
  :focus-visible{ outline:2px solid var(--copper-bright); outline-offset:3px; }

  .bg-glow{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(193,101,47,0.17), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 102%, rgba(210,72,62,0.09), transparent 65%);
    animation:glow-breathe 7s ease-in-out infinite;
  }
  @keyframes glow-breathe{ 0%,100%{ opacity:0.85; } 50%{ opacity:1; } }

  .bg-texture{
    position:absolute; inset:-10% -10%; z-index:0; pointer-events:none;
    background-image:repeating-linear-gradient(135deg, rgba(242,236,223,0.05) 0 1px, transparent 1px 26px);
    opacity:0.45;
  }

  .stage{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(14px,3vh,24px);
    padding:24px;
    text-align:center;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- LOADER ---------- */
  #loader{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    animation:loader-out .4s ease 1.65s forwards;
  }
  .loader-word{
    position:relative;
    display:inline-flex; align-items:center;
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(24px,7vw,32px);
    letter-spacing:0.14em;
    color:var(--ink);
  }
  .cut-left, .cut-right{ display:inline-flex; }
  .cut-left{ animation:cut-left-out .4s ease 1.2s forwards; }
  .cut-right{ animation:cut-right-out .4s ease 1.2s forwards; }
  .lt{
    display:inline-block; opacity:0; transform:translateY(8px);
    animation:letter-in .28s ease forwards;
  }
  .lt:nth-child(1){ animation-delay:.15s; }
  .lt:nth-child(2){ animation-delay:.22s; }
  .lt:nth-child(3){ animation-delay:.29s; }
  .lt:nth-child(4){ animation-delay:.36s; }
  .lt:nth-child(5){ animation-delay:.43s; }
  .cut-right .lt:nth-child(1){ animation-delay:.50s; }
  .cut-right .lt:nth-child(2){ animation-delay:.57s; }
  .cut-right .lt:nth-child(3){ animation-delay:.64s; }
  .cut-right .lt:nth-child(4){ animation-delay:.71s; }
  @keyframes letter-in{ to{ opacity:1; transform:translateY(0); } }
  @keyframes cut-left-out{ to{ transform:translate(-7px,9px) rotate(-7deg); opacity:0; } }
  @keyframes cut-right-out{ to{ transform:translate(7px,9px) rotate(7deg); opacity:0; } }
  .loader-scissors{
    position:absolute; left:-10%; top:50%;
    width:clamp(24px,7vw,32px); height:clamp(24px,7vw,32px);
    opacity:0;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)) drop-shadow(0 0 6px rgba(233,138,68,0.35));
    transform:translateY(-50%) rotate(45deg) scale(0.8);
    animation:scissors-pass .75s cubic-bezier(.25,.6,.3,1) .85s forwards;
  }
  @keyframes scissors-pass{
    0%{ left:-10%; opacity:0; transform:translateY(-50%) rotate(45deg) scale(0.8); }
    18%{ opacity:1; }
    46%{ left:50%; transform:translate(-50%,-50%) rotate(45deg) scale(1.05); }
    50%{ left:50%; transform:translate(-50%,-50%) rotate(45deg) scale(1.32); }
    54%{ left:50%; transform:translate(-50%,-50%) rotate(45deg) scale(1.05); }
    82%{ opacity:1; }
    100%{ left:112%; opacity:0; transform:translateY(-50%) rotate(45deg) scale(0.85); }
  }
  @keyframes loader-out{ to{ opacity:0; visibility:hidden; pointer-events:none; } }

  /* ---------- LOGO ---------- */
  .mono-holder{
    position:relative;
    height:clamp(136px,32vw,190px);
    width:clamp(136px,32vw,190px);
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute; inset:0; margin:auto;
    width:112%; height:112%;
  }
  .ring-outer{ fill:none; stroke:var(--line); stroke-width:1; }
  .ring-inner{
    fill:none; stroke:var(--copper-bright); stroke-width:1.7; opacity:0.9;
    stroke-dasharray:553; stroke-dashoffset:553;
    animation:ring-draw 1s cubic-bezier(.3,.7,.3,1) 2.25s forwards;
  }
  @keyframes ring-draw{ to{ stroke-dashoffset:0; } }

  .logo-flash{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(233,138,68,0.9), transparent 70%);
    transform:scale(0.4); opacity:0;
    animation:flash-pop .7s cubic-bezier(.2,.8,.3,1) 1.75s forwards;
    pointer-events:none;
  }
  @keyframes flash-pop{
    0%{ transform:scale(0.4); opacity:0.9; }
    60%{ transform:scale(1.15); opacity:0.35; }
    100%{ transform:scale(1.3); opacity:0; }
  }

  .logo-clip{
    position:relative;
    width:100%; height:100%;
    aspect-ratio:1/1;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--line);
    box-shadow:0 20px 44px -16px rgba(0,0,0,0.65);
    transform:scale(0.55) rotate(-8deg); opacity:0;
    animation:logo-in .8s cubic-bezier(.2,.85,.25,1) 1.85s forwards;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes logo-in{ to{ transform:scale(1) rotate(0); opacity:1; } }

  .logo-photo{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 38%;
    touch-action:manipulation;
  }

  /* ---------- LAST SLOT BANNER ---------- */
  .slot-banner{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    opacity:0;
    animation:rise-in .6s ease-out 2.70s forwards;
  }
  .slot-dot{
    width:7px; height:7px; border-radius:50%; background:#3ddc73;
    margin-bottom:6px;
    animation:dot-pulse 1.6s ease-out infinite;
  }
  @keyframes dot-pulse{
    0%{ box-shadow:0 0 0 0 rgba(61,220,115,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(61,220,115,0); }
    100%{ box-shadow:0 0 0 0 rgba(61,220,115,0); }
  }
  .slot-label{
    font-family:'Bebas Neue',sans-serif;
    font-size:12px; letter-spacing:0.28em;
    color:var(--ink-dim); margin:0;
  }
  .slot-time{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(34px,9vw,46px);
    color:var(--copper-bright);
    line-height:1; margin:2px 0;
    cursor:pointer;
    border-bottom:2px dashed rgba(233,138,68,0.4);
    transition:transform .15s ease, border-color .15s ease;
  }
  .slot-time:hover{ border-color:var(--copper-bright); }
  .slot-time:active{ transform:scale(0.96); }
  .slot-sub{
    font-size:12.5px; color:var(--ink-dim); margin:0;
  }


  .wordmark{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(15px,2.6vw,19px);
    letter-spacing:0.22em;
    color:var(--ink-dim);
    opacity:0;
    animation:rise-in .6s ease-out 3.00s forwards;
  }
  .wordmark-line{
    width:38px; height:2px; margin:0 auto;
    background:linear-gradient(90deg, transparent, var(--copper-bright), transparent);
    transform:scaleX(0); opacity:0;
    animation:line-draw .5s ease-out 3.35s forwards;
  }
  @keyframes line-draw{ to{ transform:scaleX(1); opacity:1; } }

  /* ---------- LINKS ---------- */
  .links{
    display:flex; flex-direction:column; gap:14px;
    width:min(340px,84vw);
    opacity:0;
    animation:rise-in .6s ease-out 3.25s forwards;
  }
  @keyframes rise-in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  .link-btn{
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:11px;
    padding:16px 22px; border-radius:12px; text-decoration:none;
    font-weight:700; font-size:16px; border:1px solid transparent;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .link-btn::after{
    content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:skewX(-20deg); transition:left .5s ease; pointer-events:none;
  }
  .link-btn:hover::after{ left:130%; }
  .link-btn svg{ width:21px; height:21px; flex:none; }
  .link-btn.wa{
    background:linear-gradient(180deg,#33C06E,#279456); color:#0c1a10;
    box-shadow:0 16px 30px -12px rgba(39,148,86,0.6);
  }
  .link-btn.wa:hover{ transform:translateY(-2px); box-shadow:0 20px 34px -10px rgba(39,148,86,0.7); }
  .link-btn.ig,.link-btn.wz{
    background:var(--bg-2); color:var(--ink); border-color:var(--line);
  }
  .link-btn.ig:hover,.link-btn.wz:hover{ transform:translateY(-2px); border-color:var(--copper-bright); color:var(--copper-bright); }

  @media (prefers-reduced-motion: reduce){
    #loader{ display:none; }
    .bg-glow{ animation:none; opacity:0.5; }
    .slot-banner{ animation:none !important; opacity:1; }
    .logo-clip,.wordmark,.wordmark-line,.links,.ring-inner{ animation:none !important; opacity:1; transform:none; stroke-dashoffset:0; }
    .logo-flash{ display:none; }
    .lt,.cut-left,.cut-right,.loader-scissors{ animation:none !important; }
    .slot-dot{ animation:none !important; box-shadow:none; }
  }

  @media (max-width:420px){
    .stage{ gap:16px; }
  }

  /* ---------- ADMIN (secret edit) ---------- */
  .admin-modal{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,0.72);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .admin-modal.open{ opacity:1; pointer-events:auto; }
  .admin-card{
    position:relative;
    width:min(300px,84vw);
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 22px 22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
  }
  .admin-close{
    position:absolute; top:10px; right:10px;
    width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); background:transparent;
    color:var(--ink-dim); font-size:18px; line-height:1;
    cursor:pointer;
  }
  .admin-close:hover{ color:var(--ink); border-color:var(--copper-bright); }
  .admin-label{
    font-family:'Bebas Neue',sans-serif; letter-spacing:0.12em;
    font-size:14px; color:var(--ink-dim); margin:0 0 12px; text-align:center;
  }
  .admin-input{
    width:100%; box-sizing:border-box;
    padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg);
    color:var(--ink); font-size:15px; margin-bottom:10px; text-align:center;
    font-family:'Archivo',sans-serif;
  }
  .admin-input:focus{ outline:none; border-color:var(--copper-bright); }
  .admin-error{ color:var(--redstripe); font-size:12.5px; text-align:center; margin:-4px 0 10px; }
  .admin-btn{
    width:100%; padding:11px; border-radius:10px; border:none;
    background:linear-gradient(180deg,var(--copper-bright),var(--copper));
    color:#1a1108; font-weight:700; cursor:pointer;
  }
  .admin-btn:hover{ filter:brightness(1.06); }
  .admin-toggle-btn{
    width:100%; margin-top:10px; padding:10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink-dim);
    font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Archivo',sans-serif;
    transition:border-color .2s ease, color .2s ease;
  }
  .admin-toggle-btn:hover{ border-color:var(--copper-bright); color:var(--ink); }
  .admin-toggle-btn.is-off{ border-color:var(--redstripe); color:var(--redstripe); }
  .admin-card{ max-height:86vh; overflow-y:auto; }
  .admin-divider{ height:1px; background:var(--line); margin:16px 0; }
  .admin-section-title{
    font-family:'Bebas Neue',sans-serif; letter-spacing:0.12em;
    font-size:11.5px; color:var(--ink-dim); text-align:center;
    margin:0 0 10px; text-transform:uppercase;
  }
  .theme-row{ display:flex; justify-content:center; gap:10px; margin-bottom:2px; }
  .theme-swatch{
    width:26px; height:26px; border-radius:50%;
    border:2px solid transparent; padding:0; cursor:pointer;
  }
  .theme-swatch.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--bg-2); }
  .lang-row{ display:flex; gap:8px; margin-bottom:2px; }
  .lang-btn{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink-dim); font-size:13px; cursor:pointer;
    font-family:'Archivo',sans-serif;
  }
  .lang-btn.active{ border-color:var(--copper-bright); color:var(--copper-bright); }
  .traffic-row{ text-align:center; }
  .traffic-count{ font-family:'Bebas Neue',sans-serif; font-size:30px; color:var(--copper-bright); }
  .traffic-note{ font-size:11px; color:var(--ink-dim); margin:2px 0 6px; }
  .admin-link{
    display:block; width:100%; margin-top:10px; padding:6px;
    background:none; border:none; cursor:pointer;
    font-family:'Archivo',sans-serif; font-size:12px;
    color:var(--ink-dim); text-decoration:underline;
  }
  .admin-link:hover{ color:var(--redstripe); }
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="loader-word">
    <span class="cut-left"><span class="lt">A</span><span class="lt">I</span><span class="lt">D</span><span class="lt">E</span><span class="lt">N</span></span><span>&nbsp;</span><span class="cut-right"><span class="lt">C</span><span class="lt">U</span><span class="lt">T</span><span class="lt">S</span></span>
    <svg class="loader-scissors" viewBox="0 0 24 24" fill="none">
      <defs>
        <linearGradient id="steelBlade" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff7ec"/>
          <stop offset="45%" stop-color="#cfc6b4"/>
          <stop offset="100%" stop-color="#8b8375"/>
        </linearGradient>
      </defs>
      <circle cx="6" cy="6" r="2.7" stroke="url(#steelBlade)" stroke-width="1.7"/>
      <circle cx="6" cy="18" r="2.7" stroke="url(#steelBlade)" stroke-width="1.7"/>
      <line x1="20" y1="4" x2="8.12" y2="15.88" stroke="url(#steelBlade)" stroke-width="1.9" stroke-linecap="round"/>
      <line x1="14.47" y1="14.48" x2="20" y2="20" stroke="var(--copper-bright)" stroke-width="1.9" stroke-linecap="round"/>
      <line x1="8.12" y1="8.12" x2="12" y2="12" stroke="url(#steelBlade)" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-texture" aria-hidden="true"></div>

<main class="stage">

<script>
(function(){
  var slotTimeEl = document.querySelector('.slot-time');

  function openBookingForSlot(){
    var t = slotTimeEl ? slotTimeEl.textContent.trim() : '';
    var msg = 'היי אידן, אני יכול להגיע היום לתור של ' + t;
    var url = 'https://wa.me/972547122115?text=' + encodeURIComponent(msg);
    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  if(slotTimeEl){
    slotTimeEl.addEventListener('click', openBookingForSlot);
    slotTimeEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBookingForSlot(); }
    });
  }

  // ---------------------------------------------------------------
  // GITHUB WRITE-BACK CONFIG
  // These are used only to READ config.json, which is public — no
  // credential is needed or allowed here. Writing goes through the
  // Netlify function at /.netlify/functions/save-config, which holds
  // the token server-side as the GH_TOKEN environment variable.
  // NEVER put a token in this file: the repo is public and GitHub's
  // secret scanner revokes any token committed to it within moments.
  // ---------------------------------------------------------------
  var GH_OWNER  = 'IlayBar110';
  var GH_REPO   = 'AidenCuts';
  var GH_BRANCH = 'main';
  var GH_PATH   = 'config.json';
  var SAVE_ENDPOINT = '/.netlify/functions/save-config';

  var currentTheme = 'copper';
  var currentLang  = 'en';
  var currentSlotEnabled = true;
  var slotBannerEl = document.querySelector('.slot-banner');

  function applySlotVisibility(enabled){
    currentSlotEnabled = enabled;
    if(slotBannerEl) slotBannerEl.style.display = enabled ? '' : 'none';
    var toggleBtn = document.querySelector('.admin-slot-toggle');
    if(toggleBtn){
      toggleBtn.textContent = enabled ? 'Hide last-slot banner' : 'Show last-slot banner';
      toggleBtn.classList.toggle('is-off', !enabled);
    }
  }

  var THEMES = {
    copper:{ c:'#C1652F', cb:'#E98A44' },
    steel: { c:'#5C7A8A', cb:'#7FA8BD' },
    wine:  { c:'#8C2F3D', cb:'#B84A57' },
    forest:{ c:'#3F6B4A', cb:'#5E9470' },
    gold:  { c:'#A6852B', cb:'#D9B54A' }
  };
  function applyTheme(name){
    var t = THEMES[name]; if(!t) return;
    currentTheme = name;
    document.documentElement.style.setProperty('--copper', t.c);
    document.documentElement.style.setProperty('--copper-bright', t.cb);
    document.querySelectorAll('.theme-swatch').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-theme') === name);
    });
    try{ localStorage.setItem('aidenTheme', name); }catch(e){}
  }
  function applyLanguage(lang){
    currentLang = lang;
    document.querySelectorAll('.i18n').forEach(function(el){
      var v = el.getAttribute('data-' + lang);
      if(v) el.textContent = v;
    });
    document.documentElement.setAttribute('lang', lang === 'he' ? 'he' : 'en');
    document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try{ localStorage.setItem('aidenLang', lang); }catch(e){}
  }

  // config.json (shared, in the repo) is the source of truth for every
  // visitor; localStorage is only a same-device fallback for testing
  // before the file exists (e.g. previewing outside GitHub Pages).
  async function initConfig(){
    var cfg = null;
    try{
      var raw = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_PATH;
      var r = await fetch(raw + '?t=' + Date.now());
      if(r.ok) cfg = await r.json();
    }catch(e){}
    var time = cfg && cfg.time;
    var theme = cfg && cfg.theme;
    var lang = cfg && cfg.lang;
    var slotEnabled = cfg ? cfg.slotEnabled !== false : null;
    if(!time){ try{ time = localStorage.getItem('aidenLastSlot'); }catch(e){} }
    if(!theme){ try{ theme = localStorage.getItem('aidenTheme'); }catch(e){} }
    if(!lang){ try{ lang = localStorage.getItem('aidenLang'); }catch(e){} }
    if(slotEnabled === null){
      try{ slotEnabled = localStorage.getItem('aidenSlotEnabled') !== '0'; }catch(e){ slotEnabled = true; }
    }
    applySlotVisibility(slotEnabled);
    if(time && slotTimeEl){ slotTimeEl.textContent = time; }
    applyTheme(theme || 'copper');
    applyLanguage(lang || 'en');
  }
  initConfig();

  // Commits {time, theme, lang, slotEnabled} to config.json in the repo,
  // so every visitor sees the change on their next load. The browser
  // never talks to GitHub's API and never holds a token — it posts to
  // our own Netlify function, which does the commit server-side.
  async function saveConfigToGitHub(cfg){
    var res = await fetch(SAVE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg)
    });
    if(!res.ok){
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error((errBody && errBody.error) || ('Save failed (HTTP ' + res.status + ')'));
    }
  }

  // ---- traffic (community counter, no signup — see countapi.mileshilliard.com) ----
  var TRAFFIC_KEY = 'aidencuts-landing-visits';
  try{ fetch('https://countapi.mileshilliard.com/api/v1/hit/' + TRAFFIC_KEY).catch(function(){}); }catch(e){}
  function loadTraffic(){
    var el = document.querySelector('.traffic-count');
    if(!el) return;
    el.textContent = '\u2026';
    fetch('https://countapi.mileshilliard.com/api/v1/get/' + TRAFFIC_KEY)
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(data){ el.textContent = (data && typeof data.value === 'number') ? data.value : '\u2014'; })
      .catch(function(){ el.textContent = '\u2014'; });
  }

  // secret admin: tap/click the logo 5 times within 3 seconds to open it
  var PASSWORD = "IlayHaGever";
  var logo = document.querySelector('.logo-clip');
  var clicks = [];
  var modal = document.getElementById('admin-modal');
  var stepPass = modal.querySelector('.admin-step-pass');
  var stepEdit = modal.querySelector('.admin-step-edit');
  var passInput = modal.querySelector('.admin-pass');
  var errorEl = modal.querySelector('.admin-error');
  var timeInput = modal.querySelector('.admin-time');
  var closeBtn = modal.querySelector('.admin-close');
  var unlockBtn = modal.querySelector('.admin-unlock');
  var saveBtn = modal.querySelector('.admin-save');
  var disableBtn = modal.querySelector('.admin-disable');
  var slotToggleBtn = modal.querySelector('.admin-slot-toggle');

  function isAdminOff(){
    try{ return localStorage.getItem('aidenAdminOff') === '1'; }catch(e){ return false; }
  }

  function openModal(){
    stepPass.hidden = false; stepEdit.hidden = true;
    errorEl.hidden = true; passInput.value = '';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    setTimeout(function(){ passInput.focus(); }, 50);
  }
  function closeModal(){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
  }
  function unlock(){
    if(passInput.value === PASSWORD){
      stepPass.hidden = true; stepEdit.hidden = false;
      timeInput.value = slotTimeEl ? slotTimeEl.textContent.trim() : '';
      setTimeout(function(){ timeInput.focus(); }, 50);
      loadTraffic();
    }else{
      errorEl.hidden = false;
      passInput.value = '';
      passInput.focus();
    }
  }
  async function save(){
    var v = timeInput.value.trim();
    if(v && slotTimeEl){ slotTimeEl.textContent = v; }
    try{ localStorage.setItem('aidenLastSlot', v); }catch(e){}

    var cfg = { time: v, theme: currentTheme, lang: currentLang, slotEnabled: currentSlotEnabled };
    var originalLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving\u2026';
    try{
      await saveConfigToGitHub(cfg);
      saveBtn.textContent = 'Saved!';
      setTimeout(function(){
        saveBtn.textContent = originalLabel;
        saveBtn.disabled = false;
        closeModal();
      }, 700);
    }catch(err){
      saveBtn.disabled = false;
      saveBtn.textContent = originalLabel;
      alert('Could not save to GitHub: ' + err.message + '\n\nYour change is still applied on this device.');
    }
  }
  function disableForever(){
    if(confirm('Turn off this hidden menu on this device? The logo will stop responding to taps until someone republishes the page.')){
      try{ localStorage.setItem('aidenAdminOff', '1'); }catch(e){}
      closeModal();
    }
  }
  async function toggleSlotBanner(){
    var nextEnabled = !currentSlotEnabled;
    var originalLabel = slotToggleBtn.textContent;
    slotToggleBtn.disabled = true;
    slotToggleBtn.textContent = 'Saving\u2026';
    var cfg = {
      time: slotTimeEl ? slotTimeEl.textContent.trim() : '',
      theme: currentTheme,
      lang: currentLang,
      slotEnabled: nextEnabled
    };
    try{
      await saveConfigToGitHub(cfg);
      applySlotVisibility(nextEnabled);
      try{ localStorage.setItem('aidenSlotEnabled', nextEnabled ? '1' : '0'); }catch(e){}
    }catch(err){
      slotToggleBtn.textContent = originalLabel;
      alert('Could not save to GitHub: ' + err.message);
    }
    slotToggleBtn.disabled = false;
  }

  if(logo){
    logo.style.cursor = 'pointer';
    logo.addEventListener('click', function(){
      if(isAdminOff()) return;
      var now = Date.now();
      clicks.push(now);
      clicks = clicks.filter(function(t){ return now - t < 3000; });
      if(clicks.length >= 5){
        clicks = [];
        openModal();
      }
    });
  }
  closeBtn.addEventListener('click', closeModal);
  unlockBtn.addEventListener('click', unlock);
  saveBtn.addEventListener('click', save);
  disableBtn.addEventListener('click', disableForever);
  slotToggleBtn.addEventListener('click', toggleSlotBanner);
  document.querySelectorAll('.theme-swatch').forEach(function(b){
    b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-theme')); });
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.addEventListener('click', function(){ applyLanguage(b.getAttribute('data-lang')); });
  });
  modal.querySelector('.admin-refresh').addEventListener('click', loadTraffic);
  passInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });
  timeInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') save(); });
  modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
})();
</script>
</body>
</html>
